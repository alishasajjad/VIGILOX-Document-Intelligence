# ==========================================================
# ALEMBIC
# PHASE 11.3
# ==========================================================
#
# THERE IS NO DATABASE URL IN THIS FILE.
#
# alembic.ini is committed. sqlalchemy.url is deliberately
# left empty and migrations/env.py reads DATABASE_URL from the
# environment instead -- the same variable the application
# itself uses, so a migration can never be applied to a
# different database than the one the code is talking to.
#
# Putting a real URL here would put a PostgreSQL password in
# version control, and putting a placeholder here would give
# an operator two places to configure and one of them wrong.
#
#
# USAGE
# ----------------------------------------------------------
#     alembic current              what the database is at
#     alembic history              what migrations exist
#     alembic upgrade head         apply everything pending
#     alembic downgrade -1         undo the last one
#
#     alembic revision --autogenerate -m "what changed"
#         write a new migration by diffing database/models.py
#         against the connected database. ALWAYS read what it
#         produced: autogenerate does not see a server
#         default change, a table rename, or anything it was
#         not told to compare.
#
# An existing database that already has the schema is marked
# as up to date without re-creating anything:
#
#     alembic stamp head
# ==========================================================

[alembic]

script_location = migrations

prepend_sys_path = .

# Timestamped, so `ls versions/` reads in the order the
# migrations were written rather than in hash order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Read from DATABASE_URL by migrations/env.py. See above.
sqlalchemy.url =


[post_write_hooks]


# ==========================================================
# LOGGING
# ==========================================================
#
# Alembic's own output only. The application's structured
# operational logging is configured separately in
# backend/app/core/logging.py and is not affected by this.
# ==========================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
