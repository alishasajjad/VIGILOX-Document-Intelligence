# ==========================================================
# VIGILOX PROXY LOCATIONS
# PHASE 11.9
# ==========================================================
#
# Included by both the HTTP and HTTPS server blocks, so the
# routing and the security rules cannot differ between them.
# That is the entire reason this is a separate file: two
# copies of a header-stripping rule is one copy that gets
# forgotten.
# ==========================================================


# ==========================================================
# THE IDENTITY BOUNDARY
# ==========================================================
#
# THIS IS THE MOST SECURITY-CRITICAL BLOCK IN THE DEPLOYMENT.
#
# In trusted_headers mode the application takes the reviewer
# from two headers. A browser can send any header it likes. So
# a client-supplied value must NEVER reach the upstream.
#
# proxy_set_header with an EMPTY value removes the header
# entirely. This is what "strip" means in nginx: there is no
# proxy_clear_header directive, and simply not mentioning a
# header is not enough -- nginx forwards unknown request
# headers by default, so an unmentioned
# X-VIGILOX-REVIEWER-ROLE: ADMIN would be passed straight
# through.
#
# The three lines below are therefore load-bearing, not
# defensive tidiness.
# ==========================================================

proxy_set_header X-VIGILOX-REVIEWER-ID   "";
proxy_set_header X-VIGILOX-REVIEWER-ROLE "";

# X-Forwarded-For is rewritten, not appended to. A client that
# sends its own X-Forwarded-For would otherwise prepend an
# address of its choosing, and the application reads the FIRST
# entry when the peer is trusted -- which the proxy is. Set,
# not add.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Host              $host;


# ==========================================================
# WHERE AUTHENTICATION ACTUALLY GOES
# ==========================================================
#
# THERE IS NO AUTHENTICATION IN THIS FILE, AND NONE IS FAKED.
#
# No identity provider is available in the environment this
# was written in, so rather than invent one, this is the
# integration boundary and its contract:
#
# An authenticating layer in front of this proxy -- oauth2-proxy,
# an SSO agent, an API gateway, mod_auth_openidc -- must,
# after authenticating the user:
#
#     set X-VIGILOX-REVIEWER-ID    the stable user identifier
#     set X-VIGILOX-REVIEWER-ROLE  VIEWER | REVIEWER | ADMIN
#
# and must be the only route to this proxy.
#
# WITH NOTHING IN FRONT, THE DEPLOYMENT FAILS CLOSED. The
# strip above removes the client's headers and nothing
# replaces them, so the application receives no identity and
# returns 401 on every review action. Documents can be
# uploaded and read; nothing can be approved, corrected or
# rejected.
#
# That is the correct failure direction: an unauthenticated
# deployment cannot record a review decision under somebody's
# name. It is NOT a working production configuration, and it
# must not be described as one.
#
# The line below is where the authoritative value is injected
# once such a layer exists. It is commented out because
# uncommenting it without a real authenticator in front would
# hand every visitor the same reviewer identity -- which is
# exactly the local_env behaviour that production refuses to
# start with.
#
# proxy_set_header X-VIGILOX-REVIEWER-ID   $authenticated_user;
# proxy_set_header X-VIGILOX-REVIEWER-ROLE $authenticated_role;
# ==========================================================


# ==========================================================
# CONNECTION AND BODY LIMITS
# ==========================================================

# The application enforces 10 MiB while streaming the
# multipart body. This rejects an oversized request BEFORE it
# reaches Python at all.
#
# 11m rather than 10m: multipart framing adds boundary and
# header bytes on top of the file, and a limit exactly equal
# to the file limit would reject a legitimate 10 MiB upload
# with nginx's 413 instead of the application's structured
# error. The application stays authoritative for the real
# limit; this is a backstop for the absurd.
client_max_body_size 11m;

client_body_timeout  60s;
client_header_timeout 20s;

# Concurrent connections per address. Bounds a client holding
# many connections open without limiting the polling RATE,
# which the async interface depends on.
limit_conn vigilox_conn 24;


# ==========================================================
# TIMEOUTS
# ==========================================================
#
# Two very different numbers, on purpose.
#
# Most routes read an indexed row and answer in
# milliseconds. The legacy synchronous analyze route runs the
# whole pipeline INLINE -- measured worst case 268 seconds --
# so it needs its own timeout and gets one in its own
# location block below.
#
# A single global timeout would have to be the larger of the
# two, which would leave every ordinary route able to hang
# for four and a half minutes.
# ==========================================================

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;


# ==========================================================
# ROUTES
# ==========================================================

# ----------------------------------------------------------
# SINGLE DOCUMENT JOB
# ----------------------------------------------------------
# 30/minute, burst 5 with nodelay: a reviewer selecting five
# files one after another is normal behaviour and should not
# be throttled, while a loop is.
# ----------------------------------------------------------

location = /api/v1/document-jobs {
    limit_req zone=vigilox_upload burst=5 nodelay;
    proxy_pass http://vigilox_api;
}


# ----------------------------------------------------------
# BATCH
# ----------------------------------------------------------
# 6/minute. One request can be twenty documents, so the unit
# being limited is much larger. burst=2 so a double-click is
# forgiven.
#
# The body limit matters most here: twenty files at up to
# 10 MiB is 200 MiB, which client_max_body_size above refuses
# well before Python sees it. The application's own batch file
# count limit is the real control.
# ----------------------------------------------------------

location = /api/v1/document-batches {
    limit_req zone=vigilox_batch burst=2 nodelay;
    proxy_pass http://vigilox_api;
}


# ----------------------------------------------------------
# LEGACY SYNCHRONOUS ANALYZE
# ----------------------------------------------------------
# Kept for compatibility, and the most expensive route here:
# it runs OCR inline and holds an api request thread for the
# duration.
#
# 6/minute, and a read timeout of 300 seconds to cover the
# measured 268 second worst case. burst=0: there is no
# legitimate reason to fire several of these at once, and
# each one occupies a thread from a pool of twenty.
# ----------------------------------------------------------

location = /api/v1/documents/analyze {
    limit_req zone=vigilox_analyze burst=0 nodelay;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://vigilox_api;
}


# ----------------------------------------------------------
# REVIEW SUBMISSION
# ----------------------------------------------------------
# Matches POST /api/v1/documents/{id}/reviews.
#
# 60/minute with burst 10: comfortably above human review
# speed, and a bound on automated submission of decisions
# that end up in the audit trail.
# ----------------------------------------------------------

location ~ ^/api/v1/documents/[^/]+/reviews$ {
    limit_req zone=vigilox_review burst=10 nodelay;
    proxy_pass http://vigilox_api;
}


# ----------------------------------------------------------
# DOCUMENT IMAGE
# ----------------------------------------------------------
# Streams a stored document. Buffering off so a large image
# is not written to a proxy temp file first -- these are
# identity documents and nginx's buffer directory is one more
# place they would land.
# ----------------------------------------------------------

location ~ ^/api/v1/documents/[^/]+/image$ {
    proxy_buffering off;
    proxy_pass http://vigilox_api;
}


# ----------------------------------------------------------
# PROBES
# ----------------------------------------------------------
# Reachable through the proxy so an external load balancer
# can poll readiness, and NOT rate limited: throttling a
# health probe produces exactly the false alarm the probe
# exists to avoid.
# ----------------------------------------------------------

location = /health {
    access_log off;
    proxy_pass http://vigilox_api;
}

location = /health/ready {
    access_log off;
    proxy_pass http://vigilox_api;
}


# ----------------------------------------------------------
# WORKER HEALTH
# ----------------------------------------------------------
# Internal only, for the same reason as /metrics below.
#
# It reports queue depth, how many workers are alive and
# whether work is stranded. That is a precise description of
# how loaded the service is and whether anyone is watching it,
# which is exactly what somebody probing would like to know.
#
# It is NOT a readiness probe. A load balancer must not use
# it: the API serves correctly with no worker running, and
# failing this check would turn a worker problem into an API
# outage. See docs/operations/monitoring.md.
# ----------------------------------------------------------

location = /health/workers {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;

    access_log off;
    proxy_pass http://vigilox_api;
}


# ----------------------------------------------------------
# THE FRAMEWORK'S OWN API DOCUMENTATION
# ----------------------------------------------------------
# REFUSED. All four of them.
#
# FastAPI serves /docs, /redoc and /openapi.json by default,
# and without these blocks the catch-all at the bottom of this
# file would publish them to the internet. Together they are
# the complete route surface, every request and response
# schema, every field name and every enumerated value -- plus,
# in /docs, a form for calling each route.
#
# None of that is a credential. It is a map, and handing one
# out turns "find the endpoints" into "read the list".
#
# They stay ENABLED in the application, deliberately. They are
# how the API is read during development, and an operator
# reaching the container from inside the network has a
# legitimate use for them. The refusal belongs at the ingress,
# which is the boundary that separates those two cases.
#
# Denied rather than restricted to private ranges: unlike
# /metrics there is no automated consumer to keep working, so
# there is nothing to weigh against refusing outright.
# ----------------------------------------------------------

location = /docs {
    deny  all;
}

location = /docs/oauth2-redirect {
    deny  all;
}

location = /redoc {
    deny  all;
}

location = /openapi.json {
    deny  all;
}


# ----------------------------------------------------------
# METRICS
# ----------------------------------------------------------
# NOT exposed publicly.
#
# Operational metrics describe queue depth, failure rates and
# provider behaviour. None of it is secret in the credential
# sense and all of it is useful to somebody probing the
# service.
#
# Allowed from private ranges only -- a monitoring system
# inside the network -- and refused from everywhere else. See
# Phase 11.11.
# ----------------------------------------------------------

location = /metrics {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;

    access_log off;
    proxy_pass http://vigilox_api;
}


# ----------------------------------------------------------
# STATIC ASSETS
# ----------------------------------------------------------
# Served by the application, which owns the paths. Cached
# briefly at the client: long enough to spare a reload,
# short enough that a deploy is picked up without a
# cache-busting scheme this project does not have.
# ----------------------------------------------------------

location /review/static/ {
    proxy_pass http://vigilox_api;

    proxy_cache_valid 200 5m;
    add_header Cache-Control "public, max-age=300" always;
}


# ----------------------------------------------------------
# THE FAVICON
# ----------------------------------------------------------
# Browsers request /favicon.ico unprompted. Proxied so it
# resolves rather than filling the access log with 404s.
# ----------------------------------------------------------

location = /favicon.ico {
    access_log off;
    proxy_pass http://vigilox_api;
}


# ----------------------------------------------------------
# EVERYTHING ELSE
# ----------------------------------------------------------
# The product pages and the remaining read APIs.
#
# No limit_req here, and that is the deliberate decision
# recorded in nginx.conf: the async interface polls job status
# every couple of seconds for the length of a batch, and a
# rate limit on reads would make a working upload look like a
# hung one.
# ----------------------------------------------------------

location / {
    proxy_pass http://vigilox_api;
}
