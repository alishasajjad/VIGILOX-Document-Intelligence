# ==========================================================
# VIGILOX REVERSE PROXY
# PHASE 11.9
# ==========================================================
#
# This file owns four things the application cannot:
#
#   1. THE IDENTITY BOUNDARY. It strips any client-supplied
#      reviewer identity header and injects the authoritative
#      one. Without the strip, the application's trusted-peer
#      check would be trusting a header the browser set.
#
#   2. THE AUTHORITATIVE RATE LIMIT. Shared across every api
#      replica, because it sits in front of them. The
#      application's limiter is per process and cannot bound
#      total load.
#
#   3. REQUEST BODY SIZE, rejected before it reaches Python.
#
#   4. TLS TERMINATION and HSTS.
#
# NOT VERIFIED: nginx is not installed here, so `nginx -t`
# has not run against this file. Its content is asserted by
# tests/deployment/test_phase11_containerization.py and the
# syntax check is part of Phase 12's deployment smoke, which
# reports EXTERNAL_BLOCKED while no container runtime exists.
# ==========================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------
    # LOGGING
    # ------------------------------------------------------
    # $http_x_request_id is included so a proxy log line can
    # be joined to the application's structured log for the
    # same request. The application generates the id when the
    # client does not supply one.
    #
    # Deliberately NOT logged: request bodies, and any header
    # carrying a reviewer identity. An access log is not the
    # place for either.
    # ------------------------------------------------------

    log_format vigilox
        '$remote_addr - $status $request_method $uri '
        'bytes=$body_bytes_sent rt=$request_time '
        'urt=$upstream_response_time rid=$http_x_request_id';

    access_log  /var/log/nginx/access.log vigilox;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # The application sets --no-server-header; this removes
    # nginx's own version. Neither is a control on its own,
    # both are free.
    server_tokens   off;


    # ======================================================
    # RATE LIMITING
    # ======================================================
    #
    # THIS IS THE AUTHORITATIVE LIMIT.
    #
    # The application also has one (Phase 11.7), and that one
    # is a dictionary in the memory of a single process: N api
    # replicas allow N times its limit, and a restart forgets
    # every budget. It is defence in depth and it is labelled
    # as such.
    #
    # This limit is shared, because there is one proxy in
    # front of every replica. It is the one that bounds what
    # the deployment as a whole accepts.
    #
    # FOUR ZONES, because the routes cost wildly different
    # amounts and one limit for all of them would either
    # break batch intake or leave the expensive routes open.
    # ======================================================

    # A single document job. Roughly 30 seconds of a worker.
    limit_req_zone $binary_remote_addr zone=vigilox_upload:10m rate=30r/m;

    # A batch. Up to 20 files, so ONE request can be ten
    # minutes of queue. Limited far harder per request, and
    # burst=2 rather than 0 so a reviewer who mis-clicks does
    # not get an error.
    limit_req_zone $binary_remote_addr zone=vigilox_batch:10m rate=6r/m;

    # The legacy synchronous analyze route. It runs OCR
    # INLINE in the api process, holding a request thread for
    # tens of seconds, so it is the most expensive thing here
    # per call and the most tightly limited.
    limit_req_zone $binary_remote_addr zone=vigilox_analyze:10m rate=6r/m;

    # Review submission. Cheap to serve, but it writes an
    # auditable decision, so a limit bounds automated abuse
    # without getting near human speed. A reviewer working
    # quickly does perhaps 10 a minute.
    limit_req_zone $binary_remote_addr zone=vigilox_review:10m rate=60r/m;

    # ------------------------------------------------------
    # READS ARE NOT LIMITED BY A ZONE
    # ------------------------------------------------------
    # Deliberately, and this is the mistake worth avoiding.
    #
    # The async interface POLLS: after an upload the browser
    # asks for job status every couple of seconds until the
    # document completes. A 20-file batch at ~30 seconds each
    # is ten minutes of polling. A limit tight enough to feel
    # protective would make the upload page appear to hang at
    # exactly the moment it is working correctly.
    #
    # A GET here reads one indexed row. Connection limits
    # below bound the concurrency instead of the rate.
    # ------------------------------------------------------

    limit_conn_zone $binary_remote_addr zone=vigilox_conn:10m;

    # 429, not the nginx default of 503. A 429 tells a client
    # to back off; a 503 says the service is broken.
    limit_req_status 429;
    limit_conn_status 429;

    # Log a refusal at warn. A limit nobody can see firing is
    # a limit that gets blamed for unrelated problems.
    limit_req_log_level warn;


    # ======================================================
    # UPSTREAM
    # ======================================================

    upstream vigilox_api {

        # The compose service name. Docker's DNS resolves it
        # to every api replica, so scaling the api needs no
        # change here.
        server api:8000 max_fails=3 fail_timeout=30s;

        # Reuse upstream connections. Without this, nginx
        # opens a new TCP connection per request, which at
        # polling frequency is a lot of handshakes.
        keepalive 32;
    }


    # ======================================================
    # HTTP
    # ======================================================
    #
    # Serves the application directly when there is no TLS,
    # so a local trial works. When VIGILOX_TLS_ENABLED is on
    # for a real deployment, replace this server block's
    # location with the redirect that is commented below --
    # kept as a comment rather than active because an
    # unconditional redirect to HTTPS on a deployment with no
    # certificate makes the service unreachable.
    # ======================================================

    server {

        listen      80;
        server_name _;

        # ACME HTTP-01 challenge path, left reachable so a
        # certificate can be obtained without editing this
        # file under pressure.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # For a TLS deployment, uncomment:
        #
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        include /etc/nginx/vigilox-locations.conf;
    }


    # ======================================================
    # HTTPS
    # ======================================================
    #
    # Commented out, and that is the honest state.
    #
    # NO CERTIFICATE IS SHIPPED WITH THIS REPOSITORY. A
    # self-signed certificate committed to version control is
    # worse than none at all: it looks like TLS while its
    # private key is public, and it trains everyone to click
    # through the browser warning.
    #
    # To enable, mount a real certificate at
    # /etc/nginx/tls/ and uncomment.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/tls/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/tls/privkey.pem;
    #
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     # HSTS belongs here, where TLS actually terminates.
    #     # The application keeps VIGILOX_HSTS_ENABLED=false
    #     # so this decision lives in one place.
    #     add_header Strict-Transport-Security
    #         "max-age=31536000; includeSubDomains" always;
    #
    #     include /etc/nginx/vigilox-locations.conf;
    # }
}
